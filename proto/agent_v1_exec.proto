message ExecuteHookArgs {
  .agent.v1.ExecuteHookRequest request = 1;
}

message ExecuteHookRequest {
  oneof request {
    .agent.v1.PreCompactRequestQuery pre_compact = 1;
    .agent.v1.SubagentStartRequestQuery subagent_start = 2;
    .agent.v1.SubagentStopRequestQuery subagent_stop = 3;
    .agent.v1.PreToolUseRequestQuery pre_tool_use = 4;
