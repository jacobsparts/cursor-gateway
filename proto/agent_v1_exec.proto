    .agent.v1.AfterAgentResponseRequestQuery after_agent_response = 8;
    .agent.v1.AfterAgentThoughtRequestQuery after_agent_thought = 9;
    .agent.v1.StopRequestQuery stop = 11;
  }
}

message ExecuteHookResponse {
  oneof response {
    .agent.v1.PreCompactRequestResponse pre_compact = 1;
    .agent.v1.SubagentStartRequestResponse subagent_start = 2;
    .agent.v1.SubagentStopRequestResponse subagent_stop = 3;
