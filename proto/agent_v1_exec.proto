    .agent.v1.AfterAgentThoughtRequestResponse after_agent_thought = 9;
    .agent.v1.StopRequestResponse stop = 11;
  }
}

message ExecuteHookResult {
  .agent.v1.ExecuteHookResponse response = 1;
}

message SpanContext {
  string trace_id = 1;
  string span_id = 2;
  optional uint32 trace_flags = 3;
  optional string trace_state = 4;
}
