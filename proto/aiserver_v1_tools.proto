message EditFileResult {
  .aiserver.v1.EditFileResult.FileDiff diff = 1;
  bool is_applied = 2;
  bool apply_failed = 3;
  repeated .aiserver.v1.LinterError linter_errors = 4;
  optional bool rejected = 5;
  optional int32 num_matches = 6;
  optional bool whitespace_insensitive_fallback_found_match = 7;
  optional bool no_match_found_in_line_ranges = 8;
  optional .aiserver.v1.EditFileResult.RecoverableError recoverable_error = 11;
  optional int32 num_lines_in_file = 9;
  optional bool is_subagent_edit = 10;
  optional bool diff_became_no_op_due_to_on_save_fixes = 12;
  optional .aiserver.v1.EditFileResult.EditFileHumanReview human_review = 13;
  optional .aiserver.v1.EditFileResult.HumanFeedback human_feedback = 14;
  optional bool should_eagerly_process_lints = 15;
  optional .aiserver.v1.HumanReview human_review_v2 = 16;
  optional bool were_all_new_linter_errors_resolved_by_this_edit = 17;

  message EditFileHumanReview {
    bool is_edit_accepted = 1;
    string text_result = 2;
    bool stop_and_get_new_user_input = 3;
  }

  message FileDiff {
    repeated .aiserver.v1.EditFileResult.FileDiff.ChunkDiff chunks = 1;
    .aiserver.v1.EditFileResult.FileDiff.Editor editor = 2;
    bool hit_timeout = 3;

    message ChunkDiff {
      string diff_string = 1;
      int32 old_start = 2;
      int32 new_start = 3;
      int32 old_lines = 4;
      int32 new_lines = 5;
      int32 lines_removed = 6;
      int32 lines_added = 7;
    }

    enum Editor {
      EDITOR_UNSPECIFIED = 0;
      EDITOR_AI = 1;
      EDITOR_HUMAN = 2;
    }
  }

