syntax = "proto3";

package aiserver.v1;

import "aiserver_v1_bugbot.proto";
import "aiserver_v1_filesyncserver.proto";
import "aiserver_v1_lsp_subgraph.proto";
import "aiserver_v1_repository.proto";
import "aiserver_v1_utils.proto";


message AcceptCursorPredictionEvent {
  .aiserver.v1.CursorPrediction cursor_prediction = 1;
  .aiserver.v1.PointInTimeModel point_in_time_model = 2;
}

message AddTabRequestToEvalRequest {
  string request_id = 1;
  string expected_behavior = 2;
}

message AddTabRequestToEvalResponse {
}

message AdditionalFile {
  string relative_workspace_path = 1;
  bool is_open = 2;
  repeated string visible_range_content = 3;
  optional double last_viewed_at = 4;
  repeated int32 start_line_number_one_indexed = 5;
  repeated .aiserver.v1.LineRange visible_ranges = 6;
}

message AiRequestEvent {
  .aiserver.v1.AiRequestEvent.RequestType request_type = 1;
  string request_id = 2;
  .aiserver.v1.AiRequestEvent.Source source = 3;

  enum RequestType {
    REQUEST_TYPE_UNSPECIFIED = 0;
    REQUEST_TYPE_START = 1;
    REQUEST_TYPE_END = 2;
  }

  enum Source {
    SOURCE_UNSPECIFIED = 0;
    SOURCE_CHAT = 1;
    SOURCE_CMDK = 2;
    SOURCE_APPLY = 3;
    SOURCE_COMPOSER = 4;
    SOURCE_TASK = 5;
    SOURCE_CODE_INTERPRETER = 6;
    SOURCE_INTERPRETER_EXECUTION = 7;
    SOURCE_BUGBOT = 8;
  }
}

message AnythingQuickAccessItem {
  oneof item {
    .aiserver.v1.AnythingQuickAccessItem.Resource resource = 1;
    string separator = 2;
    string section = 3;
  }

  message Resource {
    optional .aiserver.v1.PointInTimeModel model = 1;
    optional .aiserver.v1.IRange range = 2;
    optional string uri = 3;
  }
}

message AnythingQuickAccessSelectionEvent {
  string query = 1;
  repeated .aiserver.v1.AnythingQuickAccessItem items = 2;
  repeated int32 selected_indices = 3;
}

message AvailableCppModelsRequest {
}

message AvailableCppModelsResponse {
  repeated string models = 1;
  optional string default_model = 2;
}

message BackgroundFilesEvent {
  repeated .aiserver.v1.BackgroundFilesEvent.BackgroundFile files = 2;

  message BackgroundFile {
    string relative_workspace_path = 1;
    string contents = 2;
    string hash = 3;
    string full_path = 4;
  }
}

message BeforeAiEditEvent {
  oneof model {
    .aiserver.v1.PointInTimeModel point_in_time_model = 1;
    string relative_workspace_path = 5;
  }
  string tool_call_id = 2;
  optional string request_id = 3;
  optional string tool_name = 4;
}

message BlockDiffPatch {
  .aiserver.v1.BlockDiffPatch.ModelWindow start_model_window = 1;
  repeated .aiserver.v1.BlockDiffPatch.Change changes = 3;
  string relative_path = 4;
  string model_uuid = 7;
  int32 start_from_change_index = 5;

  message Change {
    string text = 1;
    .aiserver.v1.IRange range = 2;
  }

  message ModelWindow {
    repeated string lines = 1;
    int32 start_line_number = 2;
    int32 end_line_number = 3;
  }
}

message BrowserEvent {
  string view_id = 1;
  oneof event {
    .aiserver.v1.BrowserEvent.TabCreated tab_created = 2;
    .aiserver.v1.BrowserEvent.TabClosed tab_closed = 3;
    .aiserver.v1.BrowserEvent.Navigation navigation = 4;
    .aiserver.v1.BrowserEvent.ToolAction tool_action = 5;
  }

  message Navigation {
    string url = 1;
    optional string title = 2;
  }

  message TabClosed {
  }

  message TabCreated {
  }

  message ToolAction {
    string tool_name = 1;
    string args_json = 2;
    optional bool success = 3;
    optional string post_snapshot_yaml = 4;
    optional string post_url = 5;
    optional string post_title = 6;
    .aiserver.v1.BrowserEvent.ToolAction.Source source = 7;

    enum Source {
      SOURCE_UNSPECIFIED = 0;
      SOURCE_MCP_TOOL = 1;
      SOURCE_MANUAL_USER = 2;
    }
  }
}

message BugBotEvent {
  string request_id = 1;
  oneof event_type {
    .aiserver.v1.BugBotEvent.Started started = 2;
    .aiserver.v1.BugBotEvent.ReportsGenerated reports_generated = 3;
    .aiserver.v1.BugBotEvent.PressedFixInComposer pressed_fix_in_composer = 4;
    .aiserver.v1.BugBotEvent.PressedOpenInEditor pressed_open_in_editor = 5;
    .aiserver.v1.BugBotEvent.ViewedReport viewed_report = 6;
    .aiserver.v1.BugBotEvent.UserFeedback user_feedback = 7;
    .aiserver.v1.BugBotEvent.PressedAddToChat pressed_add_to_chat = 8;
    .aiserver.v1.BugBotEvent.BackgroundIntervalStarted background_interval_started = 9;
    .aiserver.v1.BugBotEvent.BackgroundIntervalEnded background_interval_ended = 10;
    .aiserver.v1.BugBotEvent.BackgroundIntervalInterrupted background_interval_interrupted = 11;
    .aiserver.v1.BugBotEvent.BackgroundIntervalErrored background_interval_errored = 12;
  }

  message BackgroundIntervalEnded {
    bool success = 1;
  }

  message BackgroundIntervalErrored {
    string error_message = 1;
  }

  message BackgroundIntervalInterrupted {
    .aiserver.v1.BugBotEvent.BackgroundIntervalInterruptedReason reason = 1;
  }

  enum BackgroundIntervalInterruptedReason {
    BACKGROUND_INTERVAL_INTERRUPTED_REASON_UNSPECIFIED = 0;
    BACKGROUND_INTERVAL_INTERRUPTED_REASON_DISABLED = 1;
    BACKGROUND_INTERVAL_INTERRUPTED_REASON_TOO_RECENT = 2;
    BACKGROUND_INTERVAL_INTERRUPTED_REASON_UNVIEWED_BUG_REPORTS = 3;
    BACKGROUND_INTERVAL_INTERRUPTED_REASON_NOT_IN_GIT_REPO = 4;
    BACKGROUND_INTERVAL_INTERRUPTED_REASON_DEFAULT_BRANCH_IS_NOT_CURRENT_BRANCH = 5;
    BACKGROUND_INTERVAL_INTERRUPTED_REASON_NO_GIT_USER = 6;
    BACKGROUND_INTERVAL_INTERRUPTED_REASON_NO_LAST_COMMIT = 7;
    BACKGROUND_INTERVAL_INTERRUPTED_REASON_LAST_COMMIT_NOT_MADE_BY_USER = 8;
    BACKGROUND_INTERVAL_INTERRUPTED_REASON_LAST_COMMIT_TOO_OLD = 9;
    BACKGROUND_INTERVAL_INTERRUPTED_REASON_DIFF_TOO_LONG = 10;
    BACKGROUND_INTERVAL_INTERRUPTED_REASON_DIFF_TOO_SHORT = 11;
    BACKGROUND_INTERVAL_INTERRUPTED_REASON_TELEMETRY_UNHEALTHY = 12;
  }

  message BackgroundIntervalStarted {
  }

  message PressedAddToChat {
    string bug_report_id = 1;
  }

  message PressedFixInComposer {
    string bug_report_id = 1;
  }

  message PressedOpenInEditor {
    .aiserver.v1.BugLocation bug_location = 1;
    string bug_report_id = 2;
  }

  message ReportsGenerated {
    .aiserver.v1.BugReports bug_reports = 1;
  }

  message Started {
  }

  message UserFeedback {
    string bug_report_id = 1;
    string feedback = 2;
  }

  message ViewedReport {
    int32 seconds_viewed = 1;
    repeated .aiserver.v1.BugBotEvent.ViewedReport.ReportView report_views = 2;

    message ReportView {
      string bug_report_id = 1;
      double view_percentage = 2;
      double text_percentage = 3;
    }
  }
}

message BugBotLinterEvent {
  string request_id = 1;
  .aiserver.v1.PointInTimeModel point_in_time_model = 2;
  oneof event_type {
    .aiserver.v1.BugBotLinterEvent.LintGenerated lint_generated = 3;
    .aiserver.v1.BugBotLinterEvent.LintDismissed lint_dismissed = 4;
    .aiserver.v1.BugBotLinterEvent.UserFeedback user_feedback = 5;
    .aiserver.v1.BugBotLinterEvent.ViewedReport viewed_report = 6;
    .aiserver.v1.BugBotLinterEvent.UnviewedReport unviewed_report = 7;
    .aiserver.v1.BugBotLinterEvent.Started started = 8;
    .aiserver.v1.BugBotLinterEvent.NotShownBecauseHeuristic not_shown_because_heuristic = 9;
  }

  message LintDismissed {
    string bug_report_id = 1;
  }

  message LintGenerated {
    .aiserver.v1.BugReport bug_report = 1;
  }

  message NotShownBecauseHeuristic {
    .aiserver.v1.BugBotLinterEvent.NotShownBecauseHeuristic.Heuristic heuristic = 1;

    enum Heuristic {
      HEURISTIC_UNSPECIFIED = 0;
      HEURISTIC_LINT_OVERLAP = 1;
      HEURISTIC_LINES_MISMATCH = 2;
    }
  }

  message Started {
  }

  message UnviewedReport {
    string bug_report_id = 1;
  }

  message UserFeedback {
    string bug_report_id = 1;
    string feedback = 2;
  }

  message ViewedReport {
    string bug_report_id = 1;
  }
}

message ChatEvent {
  string request_id = 1;
  oneof event_type {
    .aiserver.v1.ChatEvent.SubmitPrompt submit_prompt = 2;
    .aiserver.v1.ChatEvent.EndOfAnyGeneration end_of_any_generation = 3;
    .aiserver.v1.ChatEvent.EndOfUninterruptedGeneration end_of_uninterrupted_generation = 4;
  }

  message EndOfAnyGeneration {
  }

  message EndOfUninterruptedGeneration {
  }

  message SubmitPrompt {
    string prompt = 1;
  }
}

message CmdKEvent {
  .aiserver.v1.PointInTimeModel point_in_time_model = 1;
  string request_id = 2;
  optional string prompt_bar_id = 20;
  oneof event_type {
    .aiserver.v1.CmdKEvent.SubmitPrompt submit_prompt = 3;
    .aiserver.v1.CmdKEvent.EndOfGeneration end_of_generation = 4;
    .aiserver.v1.CmdKEvent.InterruptGeneration interrupt_generation = 5;
    .aiserver.v1.CmdKEvent.AcceptDiffs accept_all = 6;
    .aiserver.v1.CmdKEvent.RejectDiffs reject_all = 7;
    .aiserver.v1.CmdKEvent.RejectPartialDiff reject_partial_diff = 8;
    .aiserver.v1.CmdKEvent.AcceptPartialDiff accept_partial_diff = 9;
    .aiserver.v1.CmdKEvent.AfterReject after_reject = 10;
  }

  message AcceptDiffs {
  }

  message AcceptPartialDiff {
    .aiserver.v1.IRange green_range = 1;
    repeated string green_lines = 2;
    repeated string red_lines = 3;
  }

  message AfterReject {
  }

  message EndOfGeneration {
  }

  message InterruptGeneration {
  }

  message RejectDiffs {
    optional string actor_request_id = 1;
    optional bool silent = 2;
  }

  message RejectPartialDiff {
    .aiserver.v1.IRange green_range = 1;
    repeated string green_lines = 2;
    repeated string red_lines = 3;
  }

  message SubmitPrompt {
    .aiserver.v1.IRange original_range = 1;
    string original_text = 2;
    string prompt = 3;
  }
}

message CppAcceptEvent {
  .aiserver.v1.CppSuggestion cpp_suggestion = 1;
}

message CppAcceptEventNew {
  .aiserver.v1.CurrentlyShownCppSuggestion cpp_suggestion = 1;
  .aiserver.v1.PointInTimeModel point_in_time_model = 7;
}

message CppAppendRequest {
  bytes changes = 1;
}

message CppAppendResponse {
  bool success = 1;
}

message CppChangeQuickActionEvent {
  .aiserver.v1.PointInTimeModel point_in_time_model = 1;
  repeated .aiserver.v1.CppQuickAction added = 2;
  repeated .aiserver.v1.CppQuickAction removed = 3;
  repeated .aiserver.v1.CppQuickAction actions = 4;
}

message CppConfigRequest {
  optional bool is_nightly = 1;
  string model = 2;
  optional bool supports_cpt = 3;
}

message CppConfigResponse {
  optional int32 above_radius = 1;
  optional int32 below_radius = 2;
  optional .aiserver.v1.CppConfigResponse.MergeBehavior merge_behavior = 4;
  optional bool is_on = 5;
  optional bool is_ghost_text = 6;
  optional bool should_let_user_enable_cpp_even_if_not_pro = 7;
  repeated .aiserver.v1.CppConfigResponse.Heuristic heuristics = 8;
  repeated string exclude_recently_viewed_files_patterns = 9;
  bool enable_rvf_tracking = 10;
  int32 global_debounce_duration_millis = 11;
  int32 client_debounce_duration_millis = 12;
  string cpp_url = 13;
  bool use_whitespace_diff_history = 14;
  .aiserver.v1.CppConfigResponse.ImportPredictionConfig import_prediction_config = 15;
  bool enable_filesync_debounce_skipping = 16;
  float check_filesync_hash_percent = 17;
  string geo_cpp_backend_url = 18;
  optional .aiserver.v1.CppConfigResponse.RecentlyRejectedEditThresholds recently_rejected_edit_thresholds = 19;
  bool is_fused_cursor_prediction_model = 20;
  bool include_unchanged_lines = 21;
  bool should_fetch_rvf_text = 22;
  optional int32 max_number_of_cleared_suggestions_since_last_accept = 23;
  optional .aiserver.v1.CppConfigResponse.SuggestionHintConfig suggestion_hint_config = 24;
  bool allows_tab_chunks = 25;
  optional int32 tab_context_refresh_debounce_ms = 26;
  optional int32 tab_context_refresh_editor_change_debounce_ms = 27;

  enum Heuristic {
    HEURISTIC_UNSPECIFIED = 0;
    HEURISTIC_LOTS_OF_ADDED_TEXT = 1;
    HEURISTIC_DUPLICATING_LINE_AFTER_SUGGESTION = 2;
    HEURISTIC_DUPLICATING_MULTIPLE_LINES_AFTER_SUGGESTION = 3;
    HEURISTIC_REVERTING_USER_CHANGE = 4;
    HEURISTIC_OUTPUT_EXTENDS_BEYOND_RANGE_AND_IS_REPEATED = 5;
    HEURISTIC_SUGGESTING_RECENTLY_REJECTED_EDIT = 6;
  }

  message ImportPredictionConfig {
    bool is_disabled_by_backend = 1;
    bool should_turn_on_automatically = 2;
    bool python_enabled = 3;
  }

  message MergeBehavior {
    string type = 1;
    optional int32 limit = 2;
    optional int32 radius = 3;
  }

  message RecentlyRejectedEditThresholds {
    int32 hard_reject_threshold = 1;
    int32 soft_reject_threshold = 2;
  }

  message SuggestionHintConfig {
    repeated string important_lsp_extensions = 1;
    repeated string enabled_for_path_extensions = 2;
  }
}

message CppContextItem {
  string contents = 1;
  optional string symbol = 2;
  string relative_workspace_path = 3;
  float score = 4;
}

message CppCopyEvent {
  string clipboard_contents = 1;
}

message CppDebouncedCursorMovementEvent {
  .aiserver.v1.PointInTimeModel point_in_time_model = 1;
  .aiserver.v1.OneIndexedPosition cursor_position = 2;
}

message CppEditHistoryStatusRequest {
}

message CppEditHistoryStatusResponse {
  bool on = 1;
  bool only_if_explicit = 2;
}

message CppEditorChangedEvent {
  .aiserver.v1.PointInTimeModel point_in_time_model = 1;
  .aiserver.v1.OneIndexedPosition cursor_position = 2;
  repeated .aiserver.v1.IRange visible_ranges = 3;
  string editor_id = 4;
}

enum CppFate {
  CPP_FATE_UNSPECIFIED = 0;
  CPP_FATE_ACCEPT = 1;
  CPP_FATE_REJECT = 2;
  CPP_FATE_PARTIAL_ACCEPT = 3;
}

message CppFileDiffHistory {
  string file_name = 1;
  repeated string diff_history = 2;
  repeated double diff_history_timestamps = 3;
}

message CppHistoryAppendEvent {
  oneof event {
    .aiserver.v1.ModelChange model_change = 1;
    .aiserver.v1.CppAcceptEvent accept_event = 2;
    .aiserver.v1.CppRejectEvent reject_event = 3;
    .aiserver.v1.CppManualTriggerEvent manual_trigger_event = 4;
  }
  optional string final_model_hash = 10;
}

message CppIntentInfo {
  string source = 1;
}

message CppLinterErrorEvent {
  .aiserver.v1.PointInTimeModel point_in_time_model = 1;
  repeated .aiserver.v1.LinterError added_errors = 2;
  repeated .aiserver.v1.LinterError removed_errors = 3;
  repeated .aiserver.v1.LinterError errors = 4;
}

message CppManualTriggerEvent {
  .aiserver.v1.CursorPosition position = 2;
}

message CppManualTriggerEventNew {
  int32 line_number_one_indexed = 1;
  int32 column_number_one_indexed = 2;
  .aiserver.v1.PointInTimeModel point_in_time_model = 7;
}

message CppParameterHint {
  string label = 1;
  optional string documentation = 2;
}

message CppPartialAcceptEvent {
  .aiserver.v1.CurrentlyShownCppSuggestion cpp_suggestion = 1;
  .aiserver.v1.Edit edit = 2;
  .aiserver.v1.PointInTimeModel point_in_time_model = 3;
}

message CppQuickAction {
  string title = 1;
  repeated .aiserver.v1.CppQuickAction.Edit edits = 2;
  optional bool is_preferred = 3;
  .aiserver.v1.CppQuickActionCommand command = 4;

  message Edit {
    string text = 1;
    .aiserver.v1.IRange range = 2;
  }
}

message CppQuickActionCommand {
  string title = 1;
  string id = 2;
  repeated string arguments = 3;
}

message CppQuickActionFireEvent {
  .aiserver.v1.PointInTimeModel point_in_time_model = 1;
  oneof action_identifier {
    .aiserver.v1.CppQuickActionCommand quick_action_command = 2;
    .aiserver.v1.CppQuickAction quick_action_event = 3;
  }
}

message CppRejectEvent {
  .aiserver.v1.CppSuggestion cpp_suggestion = 1;
}

message CppRejectEventNew {
  .aiserver.v1.CurrentlyShownCppSuggestion cpp_suggestion = 1;
  .aiserver.v1.PointInTimeModel point_in_time_model = 7;
}

message CppSessionEvent {
  oneof event {
    .aiserver.v1.CppAcceptEventNew accept_event = 2;
    .aiserver.v1.CppRejectEventNew reject_event = 3;
    .aiserver.v1.CppManualTriggerEventNew manual_trigger_event = 4;
    .aiserver.v1.CppStoppedTrackingModelEvent stopped_tracking_model_event = 6;
    .aiserver.v1.CppSuggestEvent suggest_event = 7;
    .aiserver.v1.CppLinterErrorEvent linter_error_event = 8;
    .aiserver.v1.CppDebouncedCursorMovementEvent debounced_cursor_movement_event = 9;
    .aiserver.v1.CppEditorChangedEvent editor_changed_event = 10;
    .aiserver.v1.CppCopyEvent copy_event = 11;
    .aiserver.v1.CppChangeQuickActionEvent quick_action_event = 13;
    .aiserver.v1.CppQuickActionFireEvent quick_action_fire_event = 14;
    .aiserver.v1.ModelOpenedEvent model_opened_event = 15;
    .aiserver.v1.CmdKEvent cmd_k_event = 17;
    .aiserver.v1.ChatEvent chat_event = 18;
    .aiserver.v1.AiRequestEvent ai_event = 19;
    .aiserver.v1.ScrollEvent scroll_event = 21;
    .aiserver.v1.EditorCloseEvent editor_close_event = 22;
    .aiserver.v1.TabCloseEvent tab_close_event = 23;
    .aiserver.v1.ModelAddedEvent model_added_event = 33;
    .aiserver.v1.CppPartialAcceptEvent partial_accept_event = 26;
    .aiserver.v1.AcceptCursorPredictionEvent accept_cursor_prediction_event = 27;
    .aiserver.v1.RejectCursorPredictionEvent reject_cursor_prediction_event = 28;
    .aiserver.v1.SuggestCursorPredictionEvent suggest_cursor_prediction_event = 29;
    .aiserver.v1.CppTriggerEvent cpp_trigger_event = 30;
    .aiserver.v1.FinishedCppGenerationEvent finished_cpp_generation_event = 31;
    .aiserver.v1.BugBotEvent bug_bot_event = 32;
    .aiserver.v1.BugBotLinterEvent bug_bot_linter_event = 34;
    .aiserver.v1.AnythingQuickAccessSelectionEvent anything_quick_access_selection_event = 35;
    .aiserver.v1.LspSuggestionEvent lsp_suggestion_event = 36;
    .aiserver.v1.NtpEvent ntp_event = 37;
    .aiserver.v1.RepoEvent repo_event = 38;
    .aiserver.v1.GitEvent git_event = 39;
    .aiserver.v1.ToolCallEvent tool_call_event = 40;
    .aiserver.v1.BeforeAiEditEvent before_ai_edit_event = 46;
    .aiserver.v1.SearchEvent search_event = 47;
    .aiserver.v1.TerminalEvent terminal_event = 48;
    .aiserver.v1.WorktreeEvent worktree_event = 49;
    .aiserver.v1.ReviewChangesOpenedEvent review_changes_opened_event = 50;
    .aiserver.v1.BrowserEvent browser_event = 51;
    .aiserver.v1.BackgroundFilesEvent background_files_event = 16;
  }
  double performance_now_timestamp = 5;
  optional double performance_time_origin = 25;
  optional int64 global_index = 41;
  optional double performance_now_flush_time = 42;
  optional int32 event_index = 43;
  optional int32 flush_index = 44;
  optional int32 global_index_v2 = 45;
}

enum CppSource {
  CPP_SOURCE_UNSPECIFIED = 0;
  CPP_SOURCE_LINE_CHANGE = 1;
  CPP_SOURCE_TYPING = 2;
  CPP_SOURCE_OPTION_HOLD = 3;
  CPP_SOURCE_LINTER_ERRORS = 4;
  CPP_SOURCE_PARAMETER_HINTS = 5;
  CPP_SOURCE_CURSOR_PREDICTION = 6;
  CPP_SOURCE_MANUAL_TRIGGER = 7;
  CPP_SOURCE_EDITOR_CHANGE = 8;
  CPP_SOURCE_LSP_SUGGESTIONS = 9;
}

message CppStoppedTrackingModelEvent {
  string model_uuid = 1;
  string relative_path = 2;
  .aiserver.v1.CppStoppedTrackingModelEvent.StoppedTrackingModelReason reason = 3;

  enum StoppedTrackingModelReason {
    STOPPED_TRACKING_MODEL_REASON_UNSPECIFIED = 0;
    STOPPED_TRACKING_MODEL_REASON_FILE_TOO_BIG = 1;
    STOPPED_TRACKING_MODEL_REASON_FILE_DISPOSED = 2;
    STOPPED_TRACKING_MODEL_REASON_CHANGE_TOO_BIG = 3;
  }
}

message CppSuggestEvent {
  .aiserver.v1.CurrentlyShownCppSuggestion cpp_suggestion = 1;
  .aiserver.v1.PointInTimeModel point_in_time_model = 2;
  .aiserver.v1.RecoverableCppData recoverable_cpp_data = 3;
}

message CppSuggestion {
}

message CppTimelineEvent {
  double timestamp = 1;
  oneof v {
    .aiserver.v1.CppSessionEvent event = 2;
    .aiserver.v1.CppTimelineEvent.Change change = 3;
  }

  message Change {
    string model_uuid = 1;
    int32 change_index = 2;
    .aiserver.v1.ModelChange change = 3;
    .aiserver.v1.CppTimelineEvent.Change.Status status = 4;

    enum Status {
      STATUS_UNSPECIFIED = 0;
      STATUS_CORRECT = 1;
      STATUS_UNVALIDATED = 2;
      STATUS_INCORRECT = 3;
    }
  }
}

message CppTriggerEvent {
  string generation_uuid = 1;
  int32 model_version = 2;
  .aiserver.v1.OneIndexedPosition cursor_position = 3;
  .aiserver.v1.PointInTimeModel point_in_time_model = 4;
  .aiserver.v1.CppSource source = 5;
}

message CptFileDiffHistory {
  string file_name = 1;
  repeated .aiserver.v1.EditPatch edit_patches = 2;
}

message CurrentlyShownCppSuggestion {
  int32 suggestion_id = 1;
  string suggestion_text = 2;
  int32 model_version_when_the_change_is_first_indicated_to_the_user_but_not_shown_in_the_model = 3;
  optional .aiserver.v1.IRange range_of_suggestion_in_current_model = 4;
  string original_text = 5;
  optional string binding_id = 6;
}

message CursorPrediction {
  string request_id = 1;
  int32 prediction_id = 2;
  int32 line_number = 3;
  .aiserver.v1.CursorPrediction.CursorPredictionSource source = 4;
  optional string binding_id = 5;

  enum CursorPredictionSource {
    CURSOR_PREDICTION_SOURCE_UNSPECIFIED = 0;
    CURSOR_PREDICTION_SOURCE_ALWAYS_ON = 1;
    CURSOR_PREDICTION_SOURCE_ACCEPT = 2;
    CURSOR_PREDICTION_SOURCE_UNDO = 3;
    CURSOR_PREDICTION_SOURCE_EDITOR_CHANGE = 4;
  }
}

message CursorSelection {
  int32 selection_start_line_number = 1;
  int32 selection_start_column = 2;
  int32 position_line_number = 3;
  int32 position_column = 4;
}

message Edit {
  string text = 1;
  .aiserver.v1.IRange range = 2;
}

message EditHistoryAppendChangesRequest {
  string session_id = 1;
  string model_uuid = 2;
  optional string starting_model_value = 3;
  optional int32 starting_model_version = 10;
  string relative_path = 5;
  string uri = 14;
  string client_version = 6;
