syntax = "proto3";

package agent.v1;

import "agent_v1_sandbox.proto";


message LsArgs {
  string path = 1;
  repeated string ignore = 2;
  string tool_call_id = 3;
  optional .agent.v1.SandboxPolicy sandbox_policy = 4;
  optional uint32 timeout_ms = 5;
}

message LsDirectoryTreeNode {
  string abs_path = 1;
  repeated .agent.v1.LsDirectoryTreeNode children_dirs = 2;
  repeated .agent.v1.LsDirectoryTreeNode.File children_files = 3;
  bool children_were_processed = 4;
  map<string, string> full_subtree_extension_counts = 5;
  int32 num_files = 6;

  message File {
    string name = 1;
    optional .agent.v1.TerminalMetadata terminal_metadata = 2;
  }
}

message LsError {
  string path = 1;
  string error = 2;
}

message LsRejected {
  string path = 1;
  string reason = 2;
}

message LsResult {
  oneof result {
    .agent.v1.LsSuccess success = 1;
    .agent.v1.LsError error = 2;
    .agent.v1.LsRejected rejected = 3;
    .agent.v1.LsTimeout timeout = 4;
  }
}

message LsSuccess {
  .agent.v1.LsDirectoryTreeNode directory_tree_root = 1;
}

message LsTimeout {
  .agent.v1.LsDirectoryTreeNode directory_tree_root = 1;
}

message TerminalMetadata {
  optional string cwd = 1;
  repeated .agent.v1.TerminalMetadata.Command last_commands = 2;
  optional int64 last_modified_ms = 3;
  optional .agent.v1.TerminalMetadata.Command current_command = 4;

  message Command {
    string command = 1;
    optional int32 exit_code = 2;
    optional int64 timestamp_ms = 3;
    optional int64 duration_ms = 4;
  }
}
