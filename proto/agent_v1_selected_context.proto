syntax = "proto3";

package agent.v1;

import "agent_v1_agent_skills.proto";
import "agent_v1_cursor_rules.proto";
import "agent_v1_ls_exec.proto";
import "agent_v1_utils.proto";


message CallFrame {
  optional string function_name = 1;
  optional string url = 2;
  optional int32 line_number = 3;
  optional int32 column_number = 4;
}

message ExtraContextEntry {
  oneof data_or_blob_id {
    string data = 1;
    bytes blob_id = 2;
  }
}

message InvocationContext {
  oneof data {
    .agent.v1.InvocationContext.SlackThread slack_thread = 1;
    .agent.v1.InvocationContext.GithubPR github_pr = 2;
    .agent.v1.InvocationContext.IdeState ide_state = 3;
    .agent.v1.InvocationContext.MicrosoftTeamsThread microsoft_teams_thread = 4;
    bytes blob_id = 10;
  }

  message GithubPR {
    string title = 1;
    string description = 2;
    string comments = 3;
    optional string ci_failures = 4;
  }

  message IdeState {
    repeated .agent.v1.InvocationContext.IdeState.File visible_files = 1;
    repeated .agent.v1.InvocationContext.IdeState.File recently_viewed_files = 2;
    repeated .agent.v1.InvocationContext.IdeState.ViewedPullRequest currently_viewed_prs = 3;

    message File {
      string path = 1;
      optional string relative_path = 2;
      optional .agent.v1.InvocationContext.IdeState.File.CursorPosition cursor_position = 3;
      int32 total_lines = 4;
      optional string active_command = 5;

      message CursorPosition {
        int32 line = 1;
        string text = 2;
      }
    }

    message ViewedPullRequest {
      int32 number = 1;
      string url = 2;
      optional string title = 3;
      optional string folder_path = 4;
      optional string summary_json = 5;
      optional string description = 6;
    }
  }

  message MicrosoftTeamsThread {
    string thread = 1;
    optional string channel_name = 2;
    optional string team_name = 3;
    optional string channel_description = 4;
    optional string team_description = 5;
  }

  message SlackThread {
    string thread = 1;
    optional string channel_name = 2;
    optional string channel_purpose = 3;
    optional string channel_topic = 4;
    optional string sender_name = 5;
    optional string sender_id = 6;
    optional string sender_type = 7;
    optional bool is_directly_addressed = 8;
  }
}

message PromptUploadRef {
  string upload_id = 1;
}

message RecentAgent {
  string name = 1;
  string path = 2;
  optional string overview = 3;
}

message RecentAgentsContext {
  repeated .agent.v1.RecentAgent recent_agents = 1;
}

message SelectedAgenticGitAction {
  oneof params {
    .agent.v1.SelectedAgenticGitActionCommitParams commit_params = 2;
    .agent.v1.SelectedAgenticGitActionCommitParams commit_and_push_params = 6;
    .agent.v1.SelectedAgenticGitActionPushParams push_params = 3;
    .agent.v1.SelectedAgenticGitActionPushParams create_pr_params = 7;
    .agent.v1.SelectedAgenticGitActionCommitParams create_pr_with_changes_params = 8;
    .agent.v1.SelectedAgenticGitActionFixMergeConflictsParams fix_merge_conflicts_params = 4;
    .agent.v1.SelectedAgenticGitActionBabysitPrInCloudParams babysit_pr_in_cloud_params = 11;
    .agent.v1.SelectedAgenticGitActionPullLocallyParams apply_locally_params = 14;
    .agent.v1.SelectedAgenticGitActionPullLocallyParams checkout_branch_params = 15;
    .agent.v1.SelectedAgenticGitActionCommitParams create_branch_and_commit_params = 12;
    .agent.v1.SelectedAgenticGitActionCommitParams create_branch_commit_and_push_params = 13;
    .agent.v1.SelectedAgenticGitActionUpdateBranchParams update_branch_params = 16;
    .agent.v1.SelectedAgenticGitActionCreateBranchParams create_branch_params = 17;
  }
  optional .agent.v1.SelectedGitBranchContext branch_context = 5;
  optional string path_to_template_file = 9;
  optional string path_to_template_dir = 10;
}

message SelectedAgenticGitActionBabysitPrInCloudParams {
}

message SelectedAgenticGitActionCommitParams {
  repeated string files_to_commit = 1;
  repeated string files_to_exclude_from_commit = 2;
  bool should_stage_all_changes = 3;
  optional bool create_pr_draft = 4;
  repeated .agent.v1.SelectedAgenticGitFileWithStatus files_to_commit_with_status = 5;
  repeated .agent.v1.SelectedAgenticGitFileWithStatus files_to_exclude_from_commit_with_status = 6;
}

message SelectedAgenticGitActionCreateBranchParams {
}

message SelectedAgenticGitActionFixMergeConflictsParams {
  optional string base_branch = 1;
  optional string pr_url = 2;
}

message SelectedAgenticGitActionPullLocallyParams {
  string remote_branch = 1;
}

message SelectedAgenticGitActionPushParams {
  repeated string files_to_push = 1;
  optional bool create_pr_draft = 2;
}

message SelectedAgenticGitActionUpdateBranchParams {
  optional string base_branch = 1;
}

message SelectedAgenticGitFileWithStatus {
  string path = 1;
  optional string status = 2;
}

message SelectedBrowser {
  string browser_id = 1;
  string url = 2;
  optional string page_title = 3;
}

message SelectedCodeSelection {
  string content = 1;
  string path = 2;
  optional string relative_path = 3;
  .agent.v1.Range range = 4;
}

message SelectedConsoleLog {
  string message = 1;
  double timestamp = 2;
  string level = 3;
  string client_name = 4;
  string session_id = 5;
  optional .agent.v1.StackTrace stack_trace = 6;
  optional string object_data_json = 7;
}

message SelectedContext {
  repeated .agent.v1.SelectedImage selected_images = 1;
  optional .agent.v1.InvocationContext invocation_context = 2;
  repeated string extra_context = 3;
  repeated .agent.v1.ExtraContextEntry extra_context_entries = 16;
  repeated .agent.v1.SelectedFile files = 4;
  repeated .agent.v1.SelectedCodeSelection code_selections = 5;
  repeated .agent.v1.SelectedTerminal terminals = 6;
  repeated .agent.v1.SelectedTerminalSelection terminal_selections = 7;
  repeated .agent.v1.SelectedFolder folders = 8;
  repeated .agent.v1.SelectedExternalLink external_links = 9;
  repeated .agent.v1.SelectedCursorRule cursor_rules = 10;
  optional .agent.v1.SelectedGitDiff git_diff = 18;
  optional .agent.v1.SelectedGitDiffFromBranchToMain git_diff_from_branch_to_main = 11;
  repeated .agent.v1.SelectedCursorCommand cursor_commands = 12;
  repeated .agent.v1.SelectedDocumentation documentations = 13;
  repeated .agent.v1.SelectedUIElement ui_elements = 14;
  repeated .agent.v1.SelectedConsoleLog console_logs = 15;
  repeated .agent.v1.SelectedGitCommit git_commits = 17;
  repeated .agent.v1.SelectedPastChat past_chats = 19;
  repeated .agent.v1.SelectedGitPRDiffSelection git_pr_diff_selections = 20;
  repeated .agent.v1.SelectedPullRequest selected_pull_requests = 21;
  repeated .agent.v1.SelectedSubagent selected_subagents = 22;
  repeated .agent.v1.SelectedVideo selected_videos = 23;
  repeated .agent.v1.SelectedBrowser selected_browsers = 24;
  repeated .agent.v1.SelectedDocument selected_documents = 25;
  repeated .agent.v1.AgentSkill selected_skills = 26;
  optional .agent.v1.RecentAgentsContext recent_agents_context = 27;
  optional .agent.v1.SelectedAgenticGitAction selected_agentic_git_action = 34;
}

message SelectedCursorCommand {
  string name = 1;
  string content = 2;
  optional .agent.v1.SelectedPluginCapabilityRef plugin_capability = 3;
  optional string full_path = 4;
  optional string display_name = 5;
}

message SelectedCursorRule {
  .agent.v1.CursorRule rule = 1;
}

message SelectedDocument {
  oneof data_or_blob_id {
    bytes blob_id = 1;
    bytes data = 8;
    .agent.v1.SelectedDocument.BlobIdWithData blob_id_with_data = 9;
    .agent.v1.PromptUploadRef prompt_upload_ref = 10;
  }
  string uuid = 2;
  string filename = 3;
  string mime_type = 4;
  string path = 7;

  message BlobIdWithData {
    bytes blob_id = 1;
    bytes data = 2;
  }
}

message SelectedDocumentation {
  string doc_id = 1;
  string name = 2;
}

message SelectedExternalLink {
  string url = 1;
  string uuid = 2;
  optional string pdf_content = 3;
  optional bool is_pdf = 4;
  optional string filename = 5;
  optional bytes blob_id = 6;
}

message SelectedFile {
  string content = 1;
  string path = 2;
  optional string relative_path = 3;
}

message SelectedFolder {
  string path = 1;
  optional string relative_path = 2;
  .agent.v1.LsDirectoryTreeNode directory_tree = 3;
}

message SelectedGitBranchContext {
  optional string current_branch = 1;
  optional string base_branch = 2;
  optional string agent_branch_prefix = 3;
}

message SelectedGitCommit {
  string sha = 1;
  string message = 2;
  optional string description = 3;
  string diff = 4;
}

message SelectedGitDiff {
  string content = 1;
  int32 full_content_length_char_count = 2;
}

message SelectedGitDiffFromBranchToMain {
  string content = 1;
  int32 full_content_length_char_count = 2;
}

message SelectedGitPRDiffSelection {
  string pr_url = 1;
  string file_path = 2;
  int32 start_line = 3;
  int32 end_line = 4;
  optional string diff_content = 5;
  optional bytes blob_id = 6;
}

message SelectedImage {
  oneof data_or_blob_id {
    bytes blob_id = 1;
    bytes data = 8;
    .agent.v1.SelectedImage.BlobIdWithData blob_id_with_data = 9;
    .agent.v1.PromptUploadRef prompt_upload_ref = 10;
  }
  string uuid = 2;
  string path = 3;
  .agent.v1.SelectedImage.Dimension dimension = 4;
  string mime_type = 7;

  message BlobIdWithData {
    bytes blob_id = 1;
    bytes data = 2;
  }

  message Dimension {
    int32 width = 1;
    int32 height = 2;
  }
}

message SelectedPastChat {
  string agent_id = 1;
  string name = 2;
}

message SelectedPluginCapabilityRef {
  string plugin_id = 1;
  .agent.v1.SelectedPluginCapabilityType capability_type = 2;
  string source_path = 3;
  string snapshot_token = 4;
  optional string resolved_commit_sha = 5;
}

enum SelectedPluginCapabilityType {
  SELECTED_PLUGIN_CAPABILITY_TYPE_UNSPECIFIED = 0;
  SELECTED_PLUGIN_CAPABILITY_TYPE_COMMAND = 1;
  SELECTED_PLUGIN_CAPABILITY_TYPE_SKILL = 2;
  SELECTED_PLUGIN_CAPABILITY_TYPE_SUBAGENT = 3;
}

message SelectedPullRequest {
  int32 number = 1;
  string url = 2;
  optional string title = 3;
  string folder_path = 4;
  optional string summary_json = 5;
  optional string description = 6;
  optional bytes blob_id = 7;
}

message SelectedSubagent {
  string name = 1;
}

message SelectedTerminal {
  string content = 1;
  optional string title = 2;
  optional string path = 3;
}

message SelectedTerminalSelection {
  string content = 1;
  optional string title = 2;
  optional string path = 3;
  .agent.v1.Range range = 4;
}

message SelectedUIElement {
  string element = 1;
  string xpath = 2;
  string text_content = 3;
  string extra = 4;
  optional string component = 5;
  optional string component_props_json = 6;
}

message SelectedVideo {
  oneof data_or_blob_id {
    bytes blob_id = 1;
    bytes data = 8;
    .agent.v1.SelectedVideo.BlobIdWithData blob_id_with_data = 9;
    .agent.v1.SelectedVideo.SignedUrl signed_url = 11;
  }
  string uuid = 2;
  string path = 3;
  optional float fps = 4;
  string mime_type = 7;
  string filename = 10;
  bool materialize_to_filesystem = 12;

  message BlobIdWithData {
    bytes blob_id = 1;
    bytes data = 2;
  }

  message SignedUrl {
    string url = 1;
    string key = 2;
    int64 expires_at_unix_ms = 3;
    int64 refresh_after_unix_ms = 4;
    string conversation_id = 5;
  }
}

message StackTrace {
  repeated .agent.v1.CallFrame call_frames = 1;
  optional string raw_stack_trace = 2;
}
