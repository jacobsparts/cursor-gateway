syntax = "proto3";

package agent.v1;


message ConnectScmArgs {
  string tool_call_id = 1;
  oneof target {
    .agent.v1.ConnectScmGithub github = 2;
  }
}

message ConnectScmError {
  string error = 1;
}

message ConnectScmGithub {
  .agent.v1.ConnectScmGithubRepository repository = 1;
  optional string ghe_application = 2;
}

message ConnectScmGithubRepository {
  string owner = 1;
  string repo = 2;
}

message ConnectScmRejected {
  string reason = 1;
}

message ConnectScmRequestQuery {
  .agent.v1.ConnectScmArgs args = 1;
}

message ConnectScmRequestResponse {
  oneof result {
    .agent.v1.ConnectScmRequestResponse.Approved approved = 1;
    .agent.v1.ConnectScmRequestResponse.Rejected rejected = 2;
    .agent.v1.ConnectScmRequestResponse.Failed failed = 3;
  }

  message Approved {
  }

  message Failed {
    string error = 1;
  }

  message Rejected {
    string reason = 1;
  }
}

message ConnectScmResult {
  oneof result {
    .agent.v1.ConnectScmSuccess success = 1;
    .agent.v1.ConnectScmError error = 2;
    .agent.v1.ConnectScmRejected rejected = 3;
  }
}

message ConnectScmSuccess {
}

message ConnectScmToolCall {
  .agent.v1.ConnectScmArgs args = 1;
  .agent.v1.ConnectScmResult result = 2;
}
