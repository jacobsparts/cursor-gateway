syntax = "proto3";

package agent.v1;

import "agent_v1_pi_common.proto";


message PiLsExecArgs {
  optional string path = 1;
  optional int32 limit = 2;
}

message PiLsExecError {
  string error = 1;
}

message PiLsExecResult {
  oneof result {
    .agent.v1.PiLsExecSuccess success = 1;
    .agent.v1.PiLsExecError error = 2;
  }
}

message PiLsExecSuccess {
  string output = 1;
  optional .agent.v1.PiTruncation truncation = 2;
  optional uint32 entry_limit_reached = 3;
}
