syntax = "proto3";

package agent.v1;

import "agent_v1_mcp.proto";
import "agent_v1_utils.proto";
import "google_protobuf_struct.proto";


message ListMcpResourcesError {
  string error = 1;
}

message ListMcpResourcesExecArgs {
  optional string server = 1;
}

message ListMcpResourcesExecResult {
  oneof result {
    .agent.v1.ListMcpResourcesSuccess success = 1;
    .agent.v1.ListMcpResourcesError error = 2;
    .agent.v1.ListMcpResourcesRejected rejected = 3;
  }

  message McpResource {
    string uri = 1;
    optional string name = 2;
    optional string description = 3;
    optional string mime_type = 4;
    string server = 5;
    map<string, string> annotations = 6;
  }
}

message ListMcpResourcesRejected {
  string reason = 1;
}

message ListMcpResourcesSuccess {
  repeated .agent.v1.ListMcpResourcesExecResult.McpResource resources = 1;
}

message McpApproved {
}

message McpArgs {
  string name = 1;
  map<string, .google.protobuf.Value> args = 2;
  string tool_call_id = 3;
  string provider_identifier = 4;
  string tool_name = 5;
  optional .agent.v1.SmartModeApproval smart_mode_approval = 6;
  bool smart_mode_approval_only = 7;
  bool skip_approval = 8;
  string server_identifier = 9;
}

message McpError {
  string error = 1;
}

message McpImageContent {
  bytes data = 1;
  string mime_type = 2;
}

message McpPermissionDenied {
  string error = 1;
  bool is_readonly = 2;
}

message McpRejected {
  string reason = 1;
  bool is_readonly = 2;
}

message McpResult {
  oneof result {
    .agent.v1.McpSuccess success = 1;
    .agent.v1.McpError error = 2;
    .agent.v1.McpRejected rejected = 3;
    .agent.v1.McpPermissionDenied permission_denied = 4;
    .agent.v1.McpToolNotFound tool_not_found = 5;
    .agent.v1.McpServerNotFound server_not_found = 6;
    .agent.v1.McpApproved approved = 7;
  }
}

message McpServerNotFound {
  string name = 1;
  repeated string available_servers = 2;
}

message McpStateError {
  string error = 1;
}

message McpStateExecArgs {
  repeated string server_identifiers = 1;
  bool kick_only = 2;
}

message McpStateExecResult {
  oneof result {
    .agent.v1.McpStateSuccess success = 1;
    .agent.v1.McpStateError error = 2;
    .agent.v1.McpStateRejected rejected = 3;
  }
}

message McpStateRejected {
  string reason = 1;
}

message McpStateServer {
  string server_name = 1;
  string server_identifier = 2;
  optional string plugin = 3;
  optional string marketplace = 4;
  repeated .agent.v1.McpToolDefinition tools = 5;
  repeated .agent.v1.McpInstructions instructions = 6;
  optional string status = 7;
  optional string error_message = 8;
}

message McpStateSuccess {
  repeated .agent.v1.McpStateServer servers = 1;
}

message McpSuccess {
  repeated .agent.v1.McpToolResultContentItem content = 1;
  bool is_error = 2;
  .google.protobuf.Struct structured_content = 3;
}

message McpTextContent {
  string text = 1;
  optional .agent.v1.OutputLocation output_location = 2;
}

message McpToolNotFound {
  string name = 1;
  repeated string available_tools = 2;
}

message McpToolResultContentItem {
  oneof content {
    .agent.v1.McpTextContent text = 1;
    .agent.v1.McpImageContent image = 2;
  }
}

message ReadMcpResourceError {
  string uri = 1;
  string error = 2;
}

message ReadMcpResourceExecArgs {
  string server = 1;
  string uri = 2;
  optional string download_path = 3;
  string tool_call_id = 4;
  optional .agent.v1.SmartModeApproval smart_mode_approval = 5;
}

message ReadMcpResourceExecResult {
  oneof result {
    .agent.v1.ReadMcpResourceSuccess success = 1;
    .agent.v1.ReadMcpResourceError error = 2;
    .agent.v1.ReadMcpResourceRejected rejected = 3;
    .agent.v1.ReadMcpResourceNotFound not_found = 4;
  }
}

message ReadMcpResourceNotFound {
  string uri = 1;
}

message ReadMcpResourceRejected {
  string uri = 1;
  string reason = 2;
}

message ReadMcpResourceSuccess {
  string uri = 1;
  optional string name = 2;
  optional string description = 3;
  optional string mime_type = 4;
  oneof content {
    string text = 5;
    bytes blob = 6;
  }
  map<string, string> annotations = 7;
  optional string download_path = 8;
  optional .agent.v1.OutputLocation output_location = 9;
}
