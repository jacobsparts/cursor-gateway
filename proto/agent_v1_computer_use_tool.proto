syntax = "proto3";

package agent.v1;


message ClickAction {
  optional .agent.v1.Coordinate coordinate = 1;
  .agent.v1.MouseButton button = 2;
  int32 count = 3;
  optional string modifier_keys = 4;
}

message ComputerUseAction {
  oneof action {
    .agent.v1.MouseMoveAction mouse_move = 1;
    .agent.v1.ClickAction click = 2;
    .agent.v1.MouseDownAction mouse_down = 3;
    .agent.v1.MouseUpAction mouse_up = 4;
    .agent.v1.DragAction drag = 5;
    .agent.v1.ScrollAction scroll = 6;
    .agent.v1.TypeAction type = 7;
    .agent.v1.KeyAction key = 8;
    .agent.v1.WaitAction wait = 9;
    .agent.v1.ScreenshotAction screenshot = 10;
    .agent.v1.CursorPositionAction cursor_position = 11;
  }
}

message ComputerUseArgs {
  string tool_call_id = 1;
  repeated .agent.v1.ComputerUseAction actions = 2;
  optional string description = 3;
  optional bool bind_unmapped_characters = 4;
}

message ComputerUseError {
  string error = 1;
  int32 action_count = 2;
  int32 duration_ms = 3;
  optional string log = 4;
  optional string screenshot = 5;
  optional string screenshot_path = 6;
}

message ComputerUseResult {
  oneof result {
    .agent.v1.ComputerUseSuccess success = 1;
    .agent.v1.ComputerUseError error = 2;
  }
}

message ComputerUseSuccess {
  int32 action_count = 1;
  int32 duration_ms = 2;
  optional string screenshot = 3;
  optional string log = 4;
  optional string screenshot_path = 5;
  optional .agent.v1.Coordinate cursor_position = 6;
}

message ComputerUseToolCall {
  .agent.v1.ComputerUseArgs args = 1;
  .agent.v1.ComputerUseResult result = 2;
}

message Coordinate {
  int32 x = 1;
  int32 y = 2;
}

message CursorPositionAction {
}

message DragAction {
  repeated .agent.v1.Coordinate path = 1;
  .agent.v1.MouseButton button = 2;
  optional string modifier_keys = 3;
}

message KeyAction {
  string key = 1;
  optional int32 hold_duration_ms = 2;
}

enum MouseButton {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_RIGHT = 2;
  MOUSE_BUTTON_MIDDLE = 3;
  MOUSE_BUTTON_BACK = 4;
  MOUSE_BUTTON_FORWARD = 5;
}

message MouseDownAction {
  .agent.v1.MouseButton button = 1;
}

message MouseMoveAction {
  .agent.v1.Coordinate coordinate = 1;
}

message MouseUpAction {
  .agent.v1.MouseButton button = 1;
}

message ScreenshotAction {
}

message ScrollAction {
  optional .agent.v1.Coordinate coordinate = 1;
  .agent.v1.ScrollDirection direction = 2;
  int32 amount = 3;
  optional string modifier_keys = 4;
}

enum ScrollDirection {
  SCROLL_DIRECTION_UNSPECIFIED = 0;
  SCROLL_DIRECTION_UP = 1;
  SCROLL_DIRECTION_DOWN = 2;
  SCROLL_DIRECTION_LEFT = 3;
  SCROLL_DIRECTION_RIGHT = 4;
}

message TypeAction {
  string text = 1;
}

message WaitAction {
  int32 duration_ms = 1;
}
