syntax = "proto3";

package aiserver.v1;

import "google_protobuf_struct.proto";


message Action {
  oneof action {
    .aiserver.v1.GitPrAction git_pr = 4;
    .aiserver.v1.PrCommentAction pr_comment = 5;
    .aiserver.v1.SlackAction slack = 6;
    .aiserver.v1.McpAction mcp = 7;
    .aiserver.v1.ManageCheckRunAction manage_check_run = 8;
    .aiserver.v1.RequestReviewersAction request_reviewers = 9;
    .aiserver.v1.ReadSlackAction read_slack = 10;
    .aiserver.v1.ApprovePrAction approve_pr = 11;
    .aiserver.v1.ResolveReviewThreadsAction resolve_review_threads = 12;
    .aiserver.v1.MicrosoftTeamsAction microsoft_teams = 13;
    .aiserver.v1.ReadMicrosoftTeamsAction read_microsoft_teams = 14;
  }
}

message ActionPayload {
  oneof payload {
    .aiserver.v1.PrCommentActionPayload pr_comment = 1;
    .aiserver.v1.GitPrActionPayload git_pr = 2;
    .aiserver.v1.SlackActionPayload slack = 3;
    .aiserver.v1.ResolveReviewThreadsActionPayload resolve_review_threads = 4;
    .aiserver.v1.MicrosoftTeamsActionPayload microsoft_teams = 5;
  }
}

message ActionsPayload {
  repeated .aiserver.v1.ActionPayload payloads = 4;
}

message AgentOptions {
  optional bool skip_install = 1;
  optional .aiserver.v1.AgentPrivateWorkerConfig private_worker = 2;
  optional string environment_public_id = 3;
}

message AgentPrivateWorkerConfig {
  repeated .aiserver.v1.AgentPrivateWorkerLabel labels = 1;
}

message AgentPrivateWorkerLabel {
  string key = 1;
  string value = 2;
}

message ApplyAutomationSpecRequest {
  .aiserver.v1.AutomationDeploySpec spec = 1;
}

message ApplyAutomationSpecResponse {
  .aiserver.v1.AutomationWithOwner workflow = 1;
  bool created = 2;
}

message ApprovePrAction {
}

message Automation {
  string name = 2;
  bool enabled = 3;
  .aiserver.v1.Workflow workflow = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  optional string description = 7;
  string automation_id = 8;
  .aiserver.v1.AutomationScope scope = 9;
  optional string service_account_id = 10;
  .aiserver.v1.AutomationManagedBy managed_by = 11;
  optional string deploy_key = 12;
  optional int64 deploy_last_applied_at = 13;
  optional string deploy_last_apply_error = 14;
  optional string managed_type = 15;
  optional bool hidden = 16;
  optional string template_id = 17;
}

enum AutomationCreationSource {
  AUTOMATION_CREATION_SOURCE_UNSPECIFIED = 0;
  AUTOMATION_CREATION_SOURCE_PORTAL_WEB = 1;
  AUTOMATION_CREATION_SOURCE_GLASS_UI = 2;
  AUTOMATION_CREATION_SOURCE_SKILL_MCP = 3;
  AUTOMATION_CREATION_SOURCE_CONFIG_AS_CODE = 4;
}

enum AutomationDefaultTool {
  AUTOMATION_DEFAULT_TOOL_UNSPECIFIED = 0;
  AUTOMATION_DEFAULT_TOOL_OPEN_GIT_PR = 1;
}

message AutomationDeploySource {
  string kind = 1;
  optional string repo_instance_key = 2;
  optional string repo_node_id = 3;
  optional string repo_name = 4;
  optional string path = 5;
  optional string ref = 6;
  optional string commit_sha = 7;
  optional string tool_version = 8;
}

message AutomationDeploySpec {
  int32 version = 1;
  .aiserver.v1.AutomationDeploySource source = 2;
  string key = 3;
  string name = 4;
  optional string description = 5;
  bool enabled = 6;
  .aiserver.v1.AutomationScope scope = 7;
  .aiserver.v1.Workflow workflow = 8;
  optional .aiserver.v1.AutomationManagedBy managed_by = 9;
}

enum AutomationFilterDecision {
  AUTOMATION_FILTER_DECISION_UNSPECIFIED = 0;
  AUTOMATION_FILTER_DECISION_ALLOW = 1;
  AUTOMATION_FILTER_DECISION_BLOCK = 2;
  AUTOMATION_FILTER_DECISION_ERROR = 3;
}

enum AutomationManagedBy {
  AUTOMATION_MANAGED_BY_UNSPECIFIED = 0;
  AUTOMATION_MANAGED_BY_UI = 1;
  AUTOMATION_MANAGED_BY_DEPLOY = 2;
  AUTOMATION_MANAGED_BY_ANY = 3;
}

message AutomationMcpAuthState {
  optional int64 server_id = 1;
  string server_name = 2;
  .aiserver.v1.McpAuthState auth_state = 3;
}

message AutomationRun {
  string background_composer_id = 3;
  string namespaced_workflow_id = 4;
  .aiserver.v1.Workflow workflow = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  optional .aiserver.v1.PlatformActionsPayload platform_actions = 8;
  optional .aiserver.v1.TriggerMetadataPayload trigger_metadata = 9;
  string uuid = 10;
  string automation_id = 11;
  .aiserver.v1.AutomationRunStatus status = 12;
  string error_message = 13;
  optional .aiserver.v1.AutomationRunFailureDetails failure_details = 14;
  optional int64 completed_at = 15;
  optional .aiserver.v1.AutomationFilterDecision filter_decision = 16;
  optional string filter_rationale = 17;
  optional string filter_error_message = 18;
  bool can_retry = 19;
  optional string retry_ineligible_reason = 20;
  optional .aiserver.v1.AutomationRunRetryIneligibleReason retry_ineligible_reason_code = 21;
  optional string skip_reason = 22;
}

enum AutomationRunFailureCode {
  AUTOMATION_RUN_FAILURE_CODE_UNSPECIFIED = 0;
  AUTOMATION_RUN_FAILURE_CODE_UNAUTHENTICATED_REPO_ACCESS = 2;
  AUTOMATION_RUN_FAILURE_CODE_RESOURCE_EXHAUSTED = 3;
  AUTOMATION_RUN_FAILURE_CODE_UNAVAILABLE = 4;
  AUTOMATION_RUN_FAILURE_CODE_CI_SIGNAL_FAILURE = 5;
  AUTOMATION_RUN_FAILURE_CODE_UNKNOWN = 6;
  AUTOMATION_RUN_FAILURE_CODE_FAILED_TO_START_AGENT = 7;
  AUTOMATION_RUN_FAILURE_CODE_CANCELLED_BY_USER = 8;
  AUTOMATION_RUN_FAILURE_CODE_CANCELLED_AUTOMATION_DISABLED = 9;
  AUTOMATION_RUN_FAILURE_CODE_CONCURRENT_LIMIT_EXCEEDED = 10;
  AUTOMATION_RUN_FAILURE_CODE_BRANCH_NOT_FOUND = 11;
  AUTOMATION_RUN_FAILURE_CODE_MODEL_BLOCKED = 12;
  AUTOMATION_RUN_FAILURE_CODE_PRIVATE_WORKERS_DISABLED = 13;
  AUTOMATION_RUN_FAILURE_CODE_PRIVATE_WORKER_RESOURCE_EXHAUSTED = 14;
  AUTOMATION_RUN_FAILURE_CODE_GITHUB_IP_ALLOWLIST = 15;
  AUTOMATION_RUN_FAILURE_CODE_INVALID_REQUEST = 16;
  AUTOMATION_RUN_FAILURE_CODE_CLOUD_AGENT_PLAN_RESTRICTED = 17;
  AUTOMATION_RUN_FAILURE_CODE_PRIVATE_WORKER_MISSING_REPO = 18;
  AUTOMATION_RUN_FAILURE_CODE_ENVIRONMENT_BUILD_FAILED = 19;
  AUTOMATION_RUN_FAILURE_CODE_FORK_PR_UNSUPPORTED = 20;
  AUTOMATION_RUN_FAILURE_CODE_PROTECTED_SCOPE_BLOCKED = 21;
  AUTOMATION_RUN_FAILURE_CODE_CANCELLED_SUPERSEDED_BY_NEWER_EVENT = 22;
  AUTOMATION_RUN_FAILURE_CODE_USER_BLOCKED = 23;
  AUTOMATION_RUN_FAILURE_CODE_PAYLOAD_TOO_LARGE = 24;
}

message AutomationRunFailureDetails {
  .aiserver.v1.AutomationRunFailureCode code = 1;
  string title = 2;
  string message = 3;
  optional string cta_label = 4;
  optional string cta_path = 5;
}

message AutomationRunLaunchContext {
  string context_text = 1;
  string trigger_context_json = 2;
  string repo_url = 3;
  string branch = 4;
  string base_branch = 5;
  repeated .aiserver.v1.AutomationRunLaunchStartingRef starting_refs = 6;
}

message AutomationRunLaunchStartingRef {
  string repo_url = 1;
  string ref = 2;
  optional string base_ref = 3;
}

enum AutomationRunListKind {
  AUTOMATION_RUN_LIST_KIND_UNSPECIFIED = 0;
  AUTOMATION_RUN_LIST_KIND_EXECUTION_RUNS = 1;
  AUTOMATION_RUN_LIST_KIND_FILTER_EVALUATIONS = 2;
}

enum AutomationRunRetryIneligibleReason {
  AUTOMATION_RUN_RETRY_INELIGIBLE_REASON_UNSPECIFIED = 0;
  AUTOMATION_RUN_RETRY_INELIGIBLE_REASON_LAUNCH_CONTEXT_MISSING = 1;
  AUTOMATION_RUN_RETRY_INELIGIBLE_REASON_PERMISSION_DENIED = 2;
}

enum AutomationRunStatus {
  AUTOMATION_RUN_STATUS_UNSPECIFIED = 0;
  AUTOMATION_RUN_STATUS_RUNNING = 1;
  AUTOMATION_RUN_STATUS_FAILED = 2;
  AUTOMATION_RUN_STATUS_SUCCEEDED = 3;
  AUTOMATION_RUN_STATUS_SKIPPED = 4;
}

enum AutomationScope {
  AUTOMATION_SCOPE_UNSPECIFIED = 0;
  AUTOMATION_SCOPE_USER = 1;
  AUTOMATION_SCOPE_TEAM = 2;
  AUTOMATION_SCOPE_TEAM_VISIBLE = 3;
  AUTOMATION_SCOPE_TEAM_EDITABLE = 4;
  AUTOMATION_SCOPE_TEAM_EDITABLE_USER = 5;
