message GitTrigger {
  oneof event {
    .aiserver.v1.GitPullRequestEvent pull_request = 1;
    .aiserver.v1.GitPushEvent push = 2;
    .aiserver.v1.GitCICompletedEvent ci_completed = 4;
    .aiserver.v1.GitIssueLabeledEvent issue_labeled = 5;
    .aiserver.v1.GitLabelEvent label = 6;
    .aiserver.v1.GitIssueCommentEvent issue_comment = 7;
    .aiserver.v1.GitPullRequestReviewCommentEvent pull_request_review_comment = 8;
    .aiserver.v1.GitPullRequestReviewEvent pull_request_review = 9;
    .aiserver.v1.GitReviewThreadEvent review_thread = 10;
    .aiserver.v1.GitWorkflowRunEvent workflow_run = 11;
    .aiserver.v1.GitPullRequestReviewRequestedEvent pull_request_review_requested = 12;
    .aiserver.v1.GitIssueAssignedEvent issue_assigned = 13;
  }
  repeated string user_allowlist = 3;
}

