    repeated .aiserver.v1.PartialPathItem ancestor_spline = 3;
    .aiserver.v1.FastUpdateFileV2Request.UpdateType update_type = 4;
  }

  message LocalFile {
    .aiserver.v1.File file = 1;
    string hash = 2;
    string unencrypted_relative_workspace_path = 3;
  }

  enum UpdateType {
    UPDATE_TYPE_UNSPECIFIED = 0;
    UPDATE_TYPE_ADD = 1;
    UPDATE_TYPE_DELETE = 2;
    UPDATE_TYPE_MODIFY = 3;
    UPDATE_TYPE_BATCH = 4;
  }
