  repeated string remote_urls = 2;
  repeated string remote_names = 3;
  string repo_name = 4;
  string repo_owner = 5;
  bool is_tracked = 6;
  bool is_local = 7;
  optional int32 num_files = 8;
  optional double orthogonal_transform_seed = 9;
  optional .aiserver.v1.EmbeddingModel preferred_embedding_model = 10;
  string workspace_uri = 11;
  optional .aiserver.v1.DatabaseProvider preferred_db_provider = 12;
}

message RepositoryStatusRequest {
  .aiserver.v1.RepositoryInfo repository = 1;
}

message RepositoryStatusResponse {
  oneof status {
    .aiserver.v1.RepositoryStatusResponse.NotFound not_found = 1;
    .aiserver.v1.RepositoryStatusResponse.Uploading uploading = 2;
    .aiserver.v1.RepositoryStatusResponse.Syncing syncing = 3;
    .aiserver.v1.RepositoryStatusResponse.Synced synced = 4;
    .aiserver.v1.RepositoryStatusResponse.NotSubscribed not_subscribed = 5;
    .aiserver.v1.RepositoryStatusResponse.TooBig too_big = 6;
    .aiserver.v1.RepositoryStatusResponse.AuthTokenNotFound auth_token_not_found = 7;
    .aiserver.v1.RepositoryStatusResponse.AuthTokenNotAuthorized auth_token_not_authorized = 8;
    .aiserver.v1.RepositoryStatusResponse.EmptyMessage error_uploading = 10;
    .aiserver.v1.RepositoryStatusResponse.EmptyMessage error_syncing = 11;
  }
  optional bool is_owner = 9;

  message AuthTokenNotAuthorized {
  }

  message AuthTokenNotFound {
  }

  message EmptyMessage {
  }

  message NotFound {
  }

  message NotSubscribed {
  }

  message Synced {
    string branch = 1;
    string commit = 2;
  }

  message Syncing {
    string branch = 1;
    string old_commit = 2;
    string new_commit = 3;
    float progress = 4;
  }

  message TooBig {
    int32 max_size = 1;
  }

  message Uploading {
    float progress = 1;
  }
}

