  message LocalFile {
    .aiserver.v1.File file = 1;
    string hash = 2;
    string unencrypted_relative_workspace_path = 3;
  }

  enum UpdateType {
    UPDATE_TYPE_UNSPECIFIED = 0;
    UPDATE_TYPE_ADD = 1;
    UPDATE_TYPE_DELETE = 2;
    UPDATE_TYPE_MODIFY = 3;
