  .aiserver.v1.UploadFileResponse.Status status = 1;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SUCCESS = 1;
    STATUS_FAILURE = 2;
    STATUS_EXPECTED_FAILURE = 3;
    STATUS_QUEUE_BACKED_UP = 4;
  }
}

message UploadRepositoryRequest {
  .aiserver.v1.RepositoryInfo repository = 1;
}

message UploadRepositoryResponse {
  .aiserver.v1.UploadRepositoryResponse.Status status = 1;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SUCCESS = 1;
    STATUS_FAILURE = 2;
