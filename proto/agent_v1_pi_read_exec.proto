syntax = "proto3";

package agent.v1;

import "agent_v1_pi_common.proto";


message PiReadExecArgs {
  string path = 1;
  optional int32 offset = 2;
  optional int32 limit = 3;
}

message PiReadExecError {
  string error = 1;
}

message PiReadExecResult {
  oneof result {
    .agent.v1.PiReadExecSuccess success = 1;
    .agent.v1.PiReadExecError error = 2;
  }
}

message PiReadExecSuccess {
  string output = 1;
  optional .agent.v1.PiTruncation truncation = 2;
}
