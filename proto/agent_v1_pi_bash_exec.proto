syntax = "proto3";

package agent.v1;

import "agent_v1_pi_common.proto";


message PiBashExecArgs {
  string command = 1;
  optional double timeout = 2;
}

message PiBashExecError {
  string error = 1;
  optional .agent.v1.PiTruncation truncation = 2;
  optional string full_output_path = 3;
}

message PiBashExecResult {
  oneof result {
    .agent.v1.PiBashExecSuccess success = 1;
    .agent.v1.PiBashExecError error = 2;
  }
}

message PiBashExecSuccess {
  string output = 1;
  optional .agent.v1.PiTruncation truncation = 2;
  optional string full_output_path = 3;
}
