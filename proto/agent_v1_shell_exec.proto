syntax = "proto3";

package agent.v1;

import "agent_v1_hook_additional_context.proto";
import "agent_v1_sandbox.proto";
import "agent_v1_utils.proto";


message CommandClassifierResult {
  repeated .agent.v1.CommandClassifierResult.ClassifiedCommand commands = 1;
  .agent.v1.CommandClassifierResult.SuggestedSandboxMode suggested_sandbox_mode = 2;
  bool classification_failed = 3;

  message ClassifiedCommand {
    string name = 1;
    repeated string arguments = 2;
    optional string suggested_allowlist_entry = 3;
    repeated string subcommand_tokens = 4;
  }

  enum SuggestedSandboxMode {
    SUGGESTED_SANDBOX_MODE_UNSPECIFIED = 0;
    SUGGESTED_SANDBOX_MODE_SANDBOX = 1;
    SUGGESTED_SANDBOX_MODE_NO_SANDBOX = 2;
    SUGGESTED_SANDBOX_MODE_UNDETERMINED = 3;
  }
}

message ForceBackgroundShellArgs {
  string tool_call_id = 1;
}

message ForceBackgroundShellResult {
  .agent.v1.ForceBackgroundShellStatus status = 1;
  optional .agent.v1.ShellResult shell_result = 2;
}

enum ForceBackgroundShellStatus {
  FORCE_BACKGROUND_SHELL_STATUS_UNSPECIFIED = 0;
  FORCE_BACKGROUND_SHELL_STATUS_ACCEPTED = 1;
  FORCE_BACKGROUND_SHELL_STATUS_NOT_FOUND = 2;
}

enum ShellAbortReason {
  SHELL_ABORT_REASON_UNSPECIFIED = 0;
  SHELL_ABORT_REASON_USER_ABORT = 1;
  SHELL_ABORT_REASON_TIMEOUT = 2;
}

message ShellArgs {
  string command = 1;
  string working_directory = 2;
  int32 timeout = 3;
  string tool_call_id = 4;
  repeated string simple_commands = 5;
  bool has_input_redirect = 6;
  bool has_output_redirect = 7;
  .agent.v1.ShellCommandParsingResult parsing_result = 8;
  optional .agent.v1.SandboxPolicy requested_sandbox_policy = 9;
  optional uint64 file_output_threshold_bytes = 10;
  bool is_background = 11;
  bool skip_approval = 12;
  .agent.v1.TimeoutBehavior timeout_behavior = 13;
  optional int32 hard_timeout = 14;
  optional string description = 15;
  optional .agent.v1.CommandClassifierResult classifier_result = 16;
  bool close_stdin = 17;
  optional .agent.v1.ShellOutputNotificationConfig output_notification = 18;
  optional .agent.v1.SmartModeApproval smart_mode_approval = 19;
  optional .agent.v1.ShellHookApprovalRequirement hook_approval_requirement = 20;
  optional string conversation_id = 21;
  repeated string admin_command_denylist = 22;
}

enum ShellBackgroundReason {
  SHELL_BACKGROUND_REASON_UNSPECIFIED = 0;
  SHELL_BACKGROUND_REASON_TIMEOUT = 1;
  SHELL_BACKGROUND_REASON_USER_REQUEST = 2;
}

message ShellCommandParsingResult {
  bool parsing_failed = 1;
  repeated .agent.v1.ShellCommandParsingResult.ExecutableCommand executable_commands = 2;
  bool has_redirects = 3;
  bool has_command_substitution = 4;
  optional bool all_redirects_are_dev_null = 5;
  repeated .agent.v1.ShellCommandParsingResult.Redirect redirects = 6;

  message ExecutableCommand {
    string name = 1;
    repeated .agent.v1.ShellCommandParsingResult.ExecutableCommandArg args = 2;
    string full_text = 3;
  }

  message ExecutableCommandArg {
    string type = 1;
    string value = 2;
  }

  message Redirect {
    string operator = 1;
    repeated uint32 destination_fds = 2;
    string target_node_type = 3;
    optional string target_text = 4;
  }
}

message ShellFailure {
  string command = 1;
  string working_directory = 2;
  int32 exit_code = 3;
  string signal = 4;
  string stdout = 5;
  string stderr = 6;
  int32 execution_time = 7;
  optional .agent.v1.OutputLocation output_location = 8;
  optional string interleaved_output = 9;
  optional .agent.v1.ShellAbortReason abort_reason = 10;
  bool aborted = 11;
  optional int32 local_execution_time_ms = 12;
  optional string output_head = 13;
  optional string output_tail = 14;
  optional uint32 elided_chars = 15;
}

message ShellHookApprovalRequirement {
  .agent.v1.ShellHookApprovalRequirement.Kind kind = 1;
  optional string reason = 2;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_FORCE_PROMPT = 1;
  }
}

message ShellOutputNotificationConfig {
  string pattern = 1;
  string reason = 2;
  optional double debounce = 3;
  optional int32 notification_limit = 4;
}

message ShellPartialResult {
  string stdout_delta = 1;
  string stderr_delta = 2;
}

message ShellPermissionDenied {
  string command = 1;
  string working_directory = 2;
  string error = 3;
  bool is_readonly = 4;
}

message ShellRejected {
  string command = 1;
  string working_directory = 2;
  string reason = 3;
  bool is_readonly = 4;
}

message ShellResult {
  oneof result {
    .agent.v1.ShellSuccess success = 1;
    .agent.v1.ShellFailure failure = 2;
    .agent.v1.ShellTimeout timeout = 3;
    .agent.v1.ShellRejected rejected = 4;
    .agent.v1.ShellSpawnError spawn_error = 5;
    .agent.v1.ShellPermissionDenied permission_denied = 7;
  }
  optional .agent.v1.SandboxPolicy sandbox_policy = 101;
  optional bool is_background = 102;
  optional string terminals_folder = 103;
  optional uint32 pid = 104;
}

message ShellSandboxUnsupported {
  string command = 1;
  string working_directory = 2;
  string sandbox_policy_type = 3;
  string reason = 4;
  bool is_readonly = 5;
}

message ShellSpawnError {
  string command = 1;
  string working_directory = 2;
  string error = 3;
}

message ShellStream {
  oneof event {
    .agent.v1.ShellStreamStdout stdout = 1;
    .agent.v1.ShellStreamStderr stderr = 2;
    .agent.v1.ShellStreamExit exit = 3;
    .agent.v1.ShellStreamStart start = 4;
    .agent.v1.ShellRejected rejected = 5;
    .agent.v1.ShellPermissionDenied permission_denied = 6;
    .agent.v1.ShellStreamBackgrounded backgrounded = 7;
    .agent.v1.ShellStreamHookContext hook_context = 8;
    .agent.v1.ShellSandboxUnsupported sandbox_unsupported = 9;
  }
}

message ShellStreamBackgrounded {
  uint32 shell_id = 1;
  string command = 2;
  string working_directory = 3;
  optional uint32 pid = 4;
  optional int32 ms_to_wait = 5;
  optional .agent.v1.ShellBackgroundReason reason = 6;
}

message ShellStreamExit {
  uint32 code = 1;
  string cwd = 2;
  optional .agent.v1.OutputLocation output_location = 3;
  bool aborted = 4;
  optional .agent.v1.ShellAbortReason abort_reason = 5;
  optional int32 local_execution_time_ms = 6;
}

message ShellStreamHookContext {
  repeated .agent.v1.HookAdditionalContext hook_additional_contexts = 1;
}

message ShellStreamStart {
  optional .agent.v1.SandboxPolicy sandbox_policy = 1;
}

message ShellStreamStderr {
  string data = 1;
}

message ShellStreamStdout {
  string data = 1;
}

message ShellSuccess {
  string command = 1;
  string working_directory = 2;
  int32 exit_code = 3;
  string signal = 4;
  string stdout = 5;
  string stderr = 6;
  int32 execution_time = 7;
  optional .agent.v1.OutputLocation output_location = 8;
  optional uint32 shell_id = 9;
  optional string interleaved_output = 10;
  optional uint32 pid = 11;
  optional int32 ms_to_wait = 12;
  optional int32 local_execution_time_ms = 13;
  optional .agent.v1.ShellBackgroundReason background_reason = 14;
  optional string output_head = 15;
  optional string output_tail = 16;
  optional uint32 elided_chars = 17;
}

message ShellTimeout {
  string command = 1;
  string working_directory = 2;
  int32 timeout_ms = 3;
}

enum TimeoutBehavior {
  TIMEOUT_BEHAVIOR_UNSPECIFIED = 0;
  TIMEOUT_BEHAVIOR_CANCEL = 1;
  TIMEOUT_BEHAVIOR_BACKGROUND = 2;
}
