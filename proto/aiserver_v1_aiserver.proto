  optional bool for_automations = 9;
  optional .aiserver.v1.AvailableModelsScope scope = 10;
  optional bool byok_enabled = 14;
  optional bool use_react_model_picker = 11;
  optional bool use_cloud_agent_effort_modes = 12;
  optional string admin_settings_group_public_id = 13;
}

message AvailableModelsResponse {
  repeated .aiserver.v1.AvailableModelsResponse.AvailableModel models = 2;
  repeated string model_names = 1;
  optional .aiserver.v1.AvailableModelsResponse.FeatureModelConfig composer_model_config = 4;
  optional .aiserver.v1.AvailableModelsResponse.FeatureModelConfig cmd_k_model_config = 5;
  optional .aiserver.v1.AvailableModelsResponse.FeatureModelConfig background_composer_model_config = 6;
  optional .aiserver.v1.AvailableModelsResponse.FeatureModelConfig plan_execution_model_config = 7;
  optional .aiserver.v1.AvailableModelsResponse.FeatureModelConfig spec_model_config = 8;
  optional .aiserver.v1.AvailableModelsResponse.FeatureModelConfig deep_search_model_config = 9;
  optional .aiserver.v1.AvailableModelsResponse.FeatureModelConfig quick_agent_model_config = 10;
  map<string, .aiserver.v1.AvailableModelsResponse.FeatureModelConfig> subagent_model_configs = 16;
  bool use_model_parameters = 11;
  optional int32 disable_unused_models_after_n_hours = 12;
  optional int32 upgrade_unchanged_models_after_n_hours = 13;
  .aiserver.v1.AvailableModelsResponse.ModelPickerDisplayConfiguration display_configuration = 15;
  optional string experimental_model_id = 19;
  optional string experimental_model_display_name = 20;
  optional string nudge_new_chats_to_auto_optimize_for = 21;

  message AvailableModel {
    string name = 1;
    bool default_on = 2;
    optional bool is_long_context_only = 3;
    optional bool is_chat_only = 4;
    optional bool supports_agent = 5;
    optional .aiserver.v1.AvailableModelsResponse.DegradationStatus degradation_status = 6;
    optional double price = 7;
    optional .aiserver.v1.AvailableModelsResponse.TooltipData tooltip_data = 8;
    optional .aiserver.v1.AvailableModelsResponse.TooltipData tooltip_data_for_max_mode = 20;
    optional bool supports_thinking = 9;
    optional bool supports_images = 10;
    optional bool supports_auto_context = 11;
    optional int32 auto_context_max_tokens = 12;
    optional int32 auto_context_extended_max_tokens = 13;
    optional bool supports_max_mode = 14;
    optional bool supports_non_max_mode = 19;
    optional int32 context_token_limit = 15;
    optional int32 context_token_limit_for_max_mode = 16;
    optional string client_display_name = 17;
    optional string server_model_name = 18;
    optional bool is_recommended_for_background_composer = 21;
    optional bool supports_plan_mode = 22;
    optional bool supports_sandboxing = 25;
    optional bool is_user_added = 23;
    optional string inputbox_short_model_name = 24;
    optional bool supports_cmd_k = 26;
    optional bool only_supports_cmd_k = 27;
    optional int32 background_composer_sort_order = 28;
    repeated .aiserver.v1.ModelParameterDefinition parameter_definitions = 29;
    repeated .aiserver.v1.AvailableModelsResponse.ModelVariantConfig variants = 30;
    optional .aiserver.v1.CloudAgentEffortMode cloud_agent_effort_mode = 32;
    optional string cloud_migrate_to_model = 33;
    optional string upgrade_model_id = 34;
    optional bool is_hidden = 35;
    repeated string legacy_slugs = 36;
    repeated string id_aliases = 37;
    optional int32 named_model_section_index = 38;
    optional string tagline = 39;
    optional bool visible_in_routed_model_view = 40;
    optional string vendor_name = 41;
    optional .aiserver.v1.AvailableModelsResponse.ModelVendor vendor = 42;
    optional bool default_disabled_in_admin_allowlist = 43;
    repeated .aiserver.v1.CloudAgentEffortMode cloud_agent_effort_modes = 44;
    optional bool supports_smart_mode_classifier = 45;
    optional bool requires_data_retention = 46;
    optional string reason_for_zdr_consent_block = 47;
    repeated .aiserver.v1.AvailableModelsResponse.ModelPickerBadge model_picker_badges = 48;
  }

  message ConfirmationDialogue {
    string title = 1;
    string body = 2;
    string key = 3;
    bool blocks_submission = 4;
    optional .aiserver.v1.AvailableModelsResponse.ConfirmationDialogue.Presentation presentation = 5;

    enum Presentation {
      PRESENTATION_UNSPECIFIED = 0;
      PRESENTATION_POST_PICKER_WARNING = 1;
    }
  }

  enum DegradationStatus {
    DEGRADATION_STATUS_UNSPECIFIED = 0;
    DEGRADATION_STATUS_DEGRADED = 1;
    DEGRADATION_STATUS_DISABLED = 2;
  }

  message FeatureModelConfig {
    string default_model = 1;
    repeated string fallback_models = 2;
    repeated string best_of_n_default_models = 3;
  }

  message ModelPickerBadge {
    string label = 1;
    .aiserver.v1.AvailableModelsResponse.ModelPickerBadge.Variant variant = 2;
    bool dismiss_on_selection = 3;

    enum Variant {
      VARIANT_UNSPECIFIED = 0;
      VARIANT_ACCENT = 1;
      VARIANT_NEUTRAL = 2;
      VARIANT_SUCCESS = 3;
      VARIANT_WARN = 4;
      VARIANT_DANGER = 5;
    }
  }

  message ModelPickerDisplayConfiguration {

    message NamedModelsViewConfig {
      optional .aiserver.v1.AvailableModelsResponse.ModelPickerDisplayConfiguration.NamedModelsViewConfig.NamedViewToRoutedModelViewToggle named_view_to_routed_model_view_toggle = 2;
      optional .aiserver.v1.AvailableModelsResponse.ModelPickerDisplayConfiguration.NamedModelsViewConfig.NamedViewToRoutedModelViewNoButton named_view_to_routed_model_view_no_button = 3;
      optional .aiserver.v1.AvailableModelsResponse.ModelPickerDisplayConfiguration.NamedModelsViewConfig.NamedViewToRoutedModelViewButton named_view_to_routed_model_view_button = 4;

      message NamedViewToRoutedModelViewButton {
        string markdown = 1;
      }

      message NamedViewToRoutedModelViewNoButton {
      }

      message NamedViewToRoutedModelViewToggle {
        string markdown = 1;
      }
    }

    message RoutedModelViewConfig {
      optional string title = 1;
      optional .aiserver.v1.AvailableModelsResponse.ModelPickerDisplayConfiguration.RoutedModelViewConfig.RoutedModelViewToNamedViewToggle routed_model_view_to_named_view_toggle = 2;
      optional .aiserver.v1.AvailableModelsResponse.ModelPickerDisplayConfiguration.RoutedModelViewConfig.RoutedModelViewToNamedViewButton routed_model_view_to_named_view_button = 3;
      optional bool hide_search_bar = 4;
      optional bool hide_routed_model_view = 5;

      message RoutedModelViewToNamedViewButton {
        string markdown = 1;
      }

      message RoutedModelViewToNamedViewToggle {
        string title_markdown = 1;
        optional string subtitle = 2;
        optional bool set_to_last_named_model = 3;
      }
    }
  }

  message ModelVariantConfig {
    repeated .agent.v1.RequestedModel.ModelParameterValue parameter_values = 1;
    string display_name = 2;
    optional string display_name_outside_picker = 8;
    bool is_max_mode = 3;
    optional bool is_default_max_config = 4;
    optional bool is_default_non_max_config = 5;
    optional .aiserver.v1.AvailableModelsResponse.TooltipData tooltip_data = 6;
    optional string tagline = 7;
    optional string variant_string_representation = 9;
    optional .aiserver.v1.AvailableModelsResponse.ConfirmationDialogue confirmation_dialogue = 10;
    optional string legacy_slug = 11;
  }

  message ModelVendor {
    .aiserver.v1.AvailableModelsResponse.ModelVendorId id = 1;
    string display_name = 2;
  }

  enum ModelVendorId {
    MODEL_VENDOR_ID_UNSPECIFIED = 0;
    MODEL_VENDOR_ID_ANTHROPIC = 1;
    MODEL_VENDOR_ID_OPENAI = 2;
    MODEL_VENDOR_ID_GOOGLE = 3;
    MODEL_VENDOR_ID_XAI = 4;
    MODEL_VENDOR_ID_MOONSHOT = 5;
    MODEL_VENDOR_ID_CURSOR = 6;
    MODEL_VENDOR_ID_NVIDIA = 7;
    MODEL_VENDOR_ID_ZAI = 8;
    MODEL_VENDOR_ID_META = 9;
  }

  message TooltipData {
    string primary_text = 1;
    string secondary_text = 2;
    bool secondary_warning_text = 3;
    string icon = 4;
    string tertiary_text = 5;
    string tertiary_text_url = 6;
    optional string markdown_content = 7;
  }
}

enum AvailableModelsScope {
  AVAILABLE_MODELS_SCOPE_UNSPECIFIED = 0;
  AVAILABLE_MODELS_SCOPE_USER_AVAILABLE = 1;
  AVAILABLE_MODELS_SCOPE_AUTOMATIONS = 2;
  AVAILABLE_MODELS_SCOPE_ADMIN_SETTINGS_ALL_APPLICATION_MODELS = 3;
}

message BackgroundCmdKEvalRequest {
  string instruction = 1;
  .aiserver.v1.CurrentFileInfo current_file = 2;
  .aiserver.v1.SimpleRange selection_range = 3;
  string ground_truth = 4;
  .aiserver.v1.BackgroundCmdKEvalRequest.Experiment experiment = 5;
  bool run_automated_eval = 6;
  repeated .aiserver.v1.BackgroundCmdKEvalRequest.ProposedChange proposed_change_history = 7;
  repeated .aiserver.v1.CommitNote commit_notes = 8;
  repeated .aiserver.v1.CodeBlock related_code_blocks = 9;

  enum Experiment {
    EXPERIMENT_UNSPECIFIED = 0;
    EXPERIMENT_REFLECT = 1;
    EXPERIMENT_CMD_K_ORIGINAL_RADIUS = 2;
    EXPERIMENT_LOOP_ON_LINTS = 3;
    EXPERIMENT_CHAT_AND_APPLY = 4;
    EXPERIMENT_COMMIT_NOTES = 5;
    EXPERIMENT_COALESCE_GENERATIONS = 6;
    EXPERIMENT_REWORD_INSTRUCTIONS = 7;
    EXPERIMENT_CODEBASE_CHUNKS = 8;
    EXPERIMENT_SPEC_AND_APPLY = 9;
    EXPERIMENT_ASK_CODEBASE = 10;
  }

  message Lint {
    string message = 1;
    string severity = 2;
    string relative_workspace_path = 3;
    int32 start_line_number_one_indexed = 4;
    int32 start_column_one_indexed = 5;
    int32 end_line_number_inclusive_one_indexed = 6;
    int32 end_column_one_indexed = 7;
    repeated .aiserver.v1.BackgroundCmdKEvalRequest.Lint.QuickFix quick_fixes = 9;

    message QuickFix {
      string message = 1;
      string kind = 2;
      bool is_preferred = 3;
      repeated .aiserver.v1.BackgroundCmdKEvalRequest.Lint.QuickFix.Edit edits = 4;

      message Edit {
        string relative_workspace_path = 1;
        string text = 2;
        int32 start_line_number_one_indexed = 3;
        int32 start_column_one_indexed = 4;
        int32 end_line_number_inclusive_one_indexed = 5;
        int32 end_column_one_indexed = 6;
      }
    }
  }

  message ProposedChange {
    string change = 1;
    repeated .aiserver.v1.BackgroundCmdKEvalRequest.Lint linter_errors = 2;
  }
}

message BackgroundCmdKEvalResponse {
  string proposed_change = 1;
}

message BackgroundCmdKRequest {
  string instruction = 1;
  .aiserver.v1.CurrentFileInfo current_file = 2;
  .aiserver.v1.SimpleRange selection_range = 3;
  .aiserver.v1.BackgroundCmdKRequest.Type type = 4;
  repeated .aiserver.v1.BackgroundCmdKRequest.ProposedChange proposed_change_history = 5;
  repeated .aiserver.v1.CodeBlock related_code_blocks = 6;
  repeated .aiserver.v1.CppFileDiffHistory diff_history = 7;
  repeated .aiserver.v1.BackgroundCmdKRequest.Lint linter_errors = 8;
  repeated .aiserver.v1.BackgroundCmdKRequest.UsefulType useful_types = 9;
  repeated .aiserver.v1.BackgroundCmdKRequest.RecentlyViewedFile recently_viewed_files = 10;
  repeated .aiserver.v1.BackgroundCmdKRequest.Diff recent_diffs = 11;
  optional bool multiple_completions = 12;

  message Diff {
    string relative_workspace_path = 1;
    string diff = 2;
  }

  message Lint {
    string message = 1;
    string severity = 2;
    string relative_workspace_path = 3;
    int32 start_line_number_one_indexed = 4;
    int32 start_column_one_indexed = 5;
    int32 end_line_number_inclusive_one_indexed = 6;
    int32 end_column_one_indexed = 7;
    repeated .aiserver.v1.BackgroundCmdKRequest.Lint.QuickFix quick_fixes = 9;

    message QuickFix {
      string message = 1;
      string kind = 2;
      bool is_preferred = 3;
      repeated .aiserver.v1.BackgroundCmdKRequest.Lint.QuickFix.Edit edits = 4;

      message Edit {
        string relative_workspace_path = 1;
        string text = 2;
        int32 start_line_number_one_indexed = 3;
        int32 start_column_one_indexed = 4;
        int32 end_line_number_inclusive_one_indexed = 5;
        int32 end_column_one_indexed = 6;
      }
    }
  }

  message ProposedChange {
    string change = 1;
    repeated .aiserver.v1.BackgroundCmdKRequest.Lint linter_errors = 2;
  }

  message RecentlyViewedFile {
    string relative_workspace_path = 1;
    string contents = 2;
    repeated .aiserver.v1.BackgroundCmdKRequest.RecentlyViewedFile.VisibleRange visible_ranges = 3;

    message VisibleRange {
      int32 start_line_number_inclusive = 1;
      int32 end_line_number_exclusive = 2;
      optional int32 viewed_at = 3;
      optional int32 global_order_descending = 4;
    }
  }

  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_REFLECT = 1;
    TYPE_LOOP_ON_LINTS = 2;
    TYPE_CHAT_AND_APPLY = 3;
    TYPE_COALESCE_GENERATIONS = 4;
    TYPE_CODEBASE_CHUNKS = 5;
    TYPE_SPEC_AND_APPLY = 6;
    TYPE_ASK_CODEBASE = 7;
    TYPE_FINETUNED_INSTRUCTIONS = 8;
    TYPE_USEFUL_TYPES = 9;
    TYPE_CHAT_AND_APPLY_UNDERSPECIFIED = 10;
  }

  message UsefulType {
    string relative_workspace_path = 1;
    int32 start_line = 2;
    string text = 3;
    optional double score = 4;
  }
}

message BackgroundCmdKResponse {
  string proposed_change = 1;
}

